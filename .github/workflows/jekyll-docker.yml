name: Jekyll site CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: Setup Ruby and install dependencies
      uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Build with Jekyll
      run: bundle exec jekyll build --future
      env:
        JEKYLL_ENV: production
